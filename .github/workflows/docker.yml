name: Publish Docker images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 5 * * 1,3,5" # At 05:00 on Monday. Wednesday and Friday

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: "5.6"
          - version: "7.0"
          - version: "7.1"
          - version: "7.2"
          - version: "7.3"
          - version: "7.4"
          - version: "8.0"
          - version: "8.1"
          - version: "8.2"
          - version: "8.3"
          - version: "8.4"

      fail-fast: false

    name: PHP ${{ matrix.version }}

    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile-${{ matrix.version }}
          tags: |
            webnazakazku/docker-php-build:${{ matrix.version }}
            ghcr.io/${{ github.repository_owner }}/docker-php-build:${{ matrix.version }}
